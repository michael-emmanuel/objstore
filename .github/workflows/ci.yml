name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: race
        run: go test -race ./...
      - name: benchmarks compile and run once
        run: go test -run '^$' -bench . -benchtime 1x ./internal/...
  cluster-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: start local cluster
        run: scripts/local-cluster.sh up
      - name: smoke test
        run: scripts/smoke.sh
      - name: logs on failure
        if: failure()
        run: tail -n 50 .local/logs/*.log
