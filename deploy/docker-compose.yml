# Local cluster:
#   3 metadata shards (meta-0 also runs the coordinator / failure detector)
#   4 storage nodes across three zones (+ node-5 under the "expansion" profile)
#   1 gateway, 1 repairer (repair + GC), 1 rebalancer
#
# Secrets come from deploy/.env, generated by scripts/dev-config.sh and
# git-ignored. Nothing secret is written in this file.
#
#   scripts/dev-config.sh
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml --profile expansion up -d node-5
#
# Note: the three metadata processes are SHARDS (each owns a third of the
# buckets), not replicas. There is no consensus in this project; see
# docs/metadata-scaling.md.

x-common: &common
  image: objstore:dev
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  environment:
    CLUSTER_TOKEN: ${CLUSTER_TOKEN:?run scripts/dev-config.sh first}

x-node: &node
  <<: *common
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8100/healthz"]
    interval: 5s
    timeout: 2s
    retries: 5

services:
  meta-0:
    <<: *common
    command: [metadata, -listen=:7000, -shard-index=0, -data-dir=/data, -coordinator,
              -suspect-after=3s, -down-after=8s, -min-part-size=1048576, -enable-fault-injection]
    volumes: [meta-0:/data]
    ports: ["7000:7000"]
  meta-1:
    <<: *common
    command: [metadata, -listen=:7000, -shard-index=1, -data-dir=/data, -min-part-size=1048576, -enable-fault-injection]
    volumes: [meta-1:/data]
  meta-2:
    <<: *common
    command: [metadata, -listen=:7000, -shard-index=2, -data-dir=/data, -min-part-size=1048576, -enable-fault-injection]
    volumes: [meta-2:/data]

  node-1:
    <<: *node
    command: [storage-node, -id=node-1, -listen=:8100, -advertise=http://node-1:8100, -zone=az-a, -rack=rack-1,
              -data-dir=/data, -coordinator=http://meta-0:7000, -heartbeat=1s, -scrub-interval=10m, -enable-fault-injection]
    volumes: [node-1:/data]
    ports: ["8101:8100"]
  node-2:
    <<: *node
    command: [storage-node, -id=node-2, -listen=:8100, -advertise=http://node-2:8100, -zone=az-b, -rack=rack-2,
              -data-dir=/data, -coordinator=http://meta-0:7000, -heartbeat=1s, -scrub-interval=10m, -enable-fault-injection]
    volumes: [node-2:/data]
    ports: ["8102:8100"]
  node-3:
    <<: *node
    command: [storage-node, -id=node-3, -listen=:8100, -advertise=http://node-3:8100, -zone=az-c, -rack=rack-3,
              -data-dir=/data, -coordinator=http://meta-0:7000, -heartbeat=1s, -scrub-interval=10m, -enable-fault-injection]
    volumes: [node-3:/data]
    ports: ["8103:8100"]
  node-4:
    <<: *node
    command: [storage-node, -id=node-4, -listen=:8100, -advertise=http://node-4:8100, -zone=az-a, -rack=rack-4,
              -data-dir=/data, -coordinator=http://meta-0:7000, -heartbeat=1s, -scrub-interval=10m, -enable-fault-injection]
    volumes: [node-4:/data]
    ports: ["8104:8100"]
  node-5:
    <<: *node
    profiles: [expansion]
    command: [storage-node, -id=node-5, -listen=:8100, -advertise=http://node-5:8100, -zone=az-b, -rack=rack-5,
              -data-dir=/data, -coordinator=http://meta-0:7000, -heartbeat=1s, -scrub-interval=10m, -enable-fault-injection]
    volumes: [node-5:/data]
    ports: ["8105:8100"]

  gateway:
    <<: *common
    command:
      - gateway
      - -listen=:8080
      - -metadata=http://meta-0:7000,http://meta-1:7000,http://meta-2:7000
      - -coordinator=http://meta-0:7000
      - -tenants=/etc/objstore/tenants.json
      - -min-part-size=1048576
      - -segment-size=16777216
    environment:
      CLUSTER_TOKEN: ${CLUSTER_TOKEN}
      OBJSTORE_TOKEN_ALICE: ${OBJSTORE_TOKEN_ALICE}
      OBJSTORE_TOKEN_BOB: ${OBJSTORE_TOKEN_BOB}
      OBJSTORE_TOKEN_ADMIN: ${OBJSTORE_TOKEN_ADMIN}
    volumes: ["./tenants.json:/etc/objstore/tenants.json:ro"]
    ports: ["8080:8080"]
    depends_on: [meta-0, meta-1, meta-2, node-1, node-2, node-3, node-4]

  repairer:
    <<: *common
    command:
      - repairer
      - -listen=:9100
      - -metadata=http://meta-0:7000,http://meta-1:7000,http://meta-2:7000
      - -coordinator=http://meta-0:7000
      - -interval=3s
      - -repair-delay=15s
      - -gc-interval=30s
      - -gc-grace=2m
    ports: ["9100:9100"]
    depends_on: [meta-0]

  rebalancer:
    <<: *common
    command:
      - rebalancer
      - -listen=:9200
      - -metadata=http://meta-0:7000,http://meta-1:7000,http://meta-2:7000
      - -coordinator=http://meta-0:7000
      - -interval=5s
    ports: ["9200:9200"]
    depends_on: [meta-0]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.53.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

volumes:
  meta-0: {}
  meta-1: {}
  meta-2: {}
  node-1: {}
  node-2: {}
  node-3: {}
  node-4: {}
  node-5: {}
